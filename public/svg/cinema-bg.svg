<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2000" preserveAspectRatio="xMidYMin slice">
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a8b8cc" opacity="0.5"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="25%" r="80%">
      <stop offset="50%" stop-color="#dce6f0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c2d0e0" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1440" height="2000" fill="#eef2f7"/>
  <!-- dot grid -->
  <rect width="1440" height="2000" fill="url(#dots)"/>



  <!-- vignette -->
  <rect width="1440" height="2000" fill="url(#vig)"/>
</svg>